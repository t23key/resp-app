<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE14D">
<meta name="description" content="SMA live quiz. Join with a nickname, answer fast, climb the leaderboard.">
<title>SMA Live Quiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='10' fill='%23FFE14D' stroke='%23161B3D' stroke-width='5'/%3E%3Cpath d='M20 44l9-24h6l9 24h-6l-2-6H28l-2 6zm10-11h4l-2-7z' fill='%23161B3D'/%3E%3C/svg%3E">
<meta name="smaq-build" content="oct07-photo"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Public+Sans:wght@400..900&display=swap">
<style>:root{--ink:#161B3D;--ink2:#3B4160;--cream:#FFFBEF;--paper:#FFFDF7;--yellow:#FFE14D;--coral:#FF6B6B;--teal:#2EC4B6;--violet:#A78BFA;--b:3px;--sh:6px;--r:6px;
--display:'Oswald','Arial Narrow',Impact,sans-serif;--body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Arabic',Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;right:0;bottom:0;left:0;background-image:radial-gradient(rgba(22,27,61,.11) 1.3px,transparent 1.5px);background-size:22px 22px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em}

/* ---------- shared atoms ---------- */
.card{background:var(--paper);border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh) var(--sh) 0 var(--ink)}
.sticker{display:inline-block;background:var(--yellow);border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);padding:.3em .8em;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;line-height:1.15}
.tilt-l{transform:rotate(-3deg)}.tilt-r{transform:rotate(3deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;background:var(--yellow);border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh) var(--sh) 0 var(--ink);padding:.7em 1.4em;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:1.25em;transition:transform .08s,box-shadow .08s,background .15s;user-select:none;-webkit-user-select:none}
.btn:active,.btn.press{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh) var(--sh) 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn.small{font-size:.95em;padding:.45em .9em;box-shadow:4px 4px 0 var(--ink)}
.btn.coral{background:var(--coral)}.btn.teal{background:var(--teal)}
.oA{background:var(--coral)}.oB{background:var(--teal)}.oC{background:var(--yellow)}.oD{background:var(--violet)}
.av{display:inline-grid;place-items:center;line-height:1}
.nm{unicode-bidi:plaintext}
.floaty{position:fixed;z-index:90;pointer-events:none;will-change:transform,opacity;filter:drop-shadow(2px 2px 0 rgba(22,27,61,.35));white-space:nowrap}
.floaty.tagf{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:.2em .6em;font-weight:800;filter:none;box-shadow:3px 3px 0 var(--ink)}
.puff{position:fixed;z-index:95;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;pointer-events:none}
.confetti{position:fixed;top:0;right:0;bottom:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:80}
.toast{position:fixed;left:50%;bottom:6vh;z-index:99;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.7em 1.1em;border-radius:var(--r);font-weight:700;box-shadow:4px 4px 0 var(--coral);max-width:92vw;text-align:center}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#bbb;border:2px solid var(--ink);vertical-align:middle}
.dot.live{background:var(--teal)}.dot.warn{background:var(--yellow)}.dot.down{background:var(--coral)}
.spin{width:44px;height:44px;border:5px solid var(--ink);border-right-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;display:grid;place-items:center;background:rgba(22,27,61,.45);padding:16px}
.modal .card{padding:1.4em;max-width:30em;width:100%;display:flex;flex-direction:column;gap:1em;animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
.modal .row{display:flex;gap:.8em;justify-content:flex-end;flex-wrap:wrap}

@keyframes pop{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
@keyframes rise{0%{transform:translateY(22px);opacity:0}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg) translateX(-3px)}75%{transform:rotate(1.2deg) translateX(3px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(30px,-40px) rotate(160deg)}100%{transform:translate(0,0) rotate(360deg)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.enter{animation:rise .45s cubic-bezier(.2,.9,.3,1.15) both}
.popin{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.shake{animation:shake .45s ease}
.bob{animation:bob 2.4s ease-in-out infinite}

/* ================= PLAYER ================= */
.player{font-size:16px}
.pwrap{position:relative;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pscreen{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px 16px calc(66px + env(safe-area-inset-bottom))}
.pcenter{align-items:center;justify-content:center;text-align:center}
.phead{position:sticky;top:0;z-index:30}
.ptop{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 12px 12px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,251,239,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:var(--b) solid var(--ink)}
.ptop .me{display:flex;align-items:center;gap:6px;min-width:0;font-weight:800;font-size:14px}
.ptop .me .av{font-size:22px}
.ptop .me .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .scorebox{justify-self:end;text-align:right;line-height:1}
.ptop .scorebox b{display:block;font-family:var(--display);font-weight:700;font-size:24px}
.ptop .scorebox span{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.rankb{position:relative;justify-self:center;min-width:108px;text-align:center;background:var(--yellow);border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink);padding:4px 14px 6px;transform:rotate(-3deg);transition:background .3s}
.rankb.top1{background:var(--teal)}
.rankb .rn{display:block;position:relative;height:50px;overflow:hidden;font-family:var(--display);font-weight:700;font-size:50px;line-height:50px}
.rankb .rn span{display:block}
.rankb .of{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.rankb .delta{position:absolute;top:-12px;right:-16px;padding:2px 7px;border:2px solid var(--ink);border-radius:var(--r);font-weight:800;font-size:12px;transform:rotate(8deg)}
.delta.up{background:var(--teal)}.delta.dn{background:var(--coral)}
.soundbtn{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;width:40px;height:40px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);box-shadow:2px 2px 0 var(--ink);font-size:18px}

.pjoin{justify-content:center;gap:22px;padding-top:28px}
.brand{text-align:center;position:relative}
.logo{font-family:var(--display);font-weight:700;font-size:min(30vw,148px);line-height:.85;letter-spacing:.01em;text-shadow:6px 6px 0 var(--coral)}
.logo2{font-family:var(--display);font-weight:600;font-size:30px;text-transform:uppercase;letter-spacing:.35em;margin-top:6px}
.brand .sticker{position:absolute;right:2%;top:-8px;font-size:13px;transform:rotate(8deg);background:var(--teal)}
.joinform{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:20px}
.avpick{align-self:center;width:92px;height:92px;border:var(--b) solid var(--ink);border-radius:50%;background:var(--yellow);box-shadow:5px 5px 0 var(--ink);font-size:50px;display:grid;place-items:center;transition:transform .15s}
.avpick:active{transform:scale(.92) rotate(-8deg)}
.avhint{text-align:center;font-size:12px;font-weight:700;color:var(--ink2);margin-top:-6px}
.joinform label{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:15px}
.joinform input{width:100%;padding:14px 14px;border:var(--b) solid var(--ink);border-radius:var(--r);background:#fff;font-size:22px;font-weight:700;outline:none;box-shadow:inset 3px 3px 0 rgba(22,27,61,.08)}
.joinform input:focus{background:#FFFDE6;box-shadow:0 0 0 4px var(--yellow)}
.err{min-height:18px;color:#C2253A;font-weight:800;font-size:14px;text-align:center}
.tiny{text-align:center;font-size:11px;color:var(--ink2);font-weight:700;letter-spacing:.05em}
.bigav{font-size:96px;line-height:1}
.pwait h1{font-family:var(--display);font-weight:700;font-size:54px;text-transform:uppercase;line-height:1}
.pwait .bignm{font-size:24px;font-weight:800;max-width:100%;overflow-wrap:anywhere}
.pcount{font-size:18px;font-weight:700}.pcount b{font-family:var(--display);font-size:26px}
.tip{min-height:66px;max-width:420px;font-size:16px;font-weight:600;color:var(--ink2);line-height:1.4;padding:10px 14px;border:2px dashed var(--ink2);border-radius:var(--r)}
.link{text-decoration:underline;font-weight:800;color:var(--ink2);padding:8px}

.ppre{align-items:center;justify-content:center;text-align:center;gap:18px}
.ppre .sticker{font-size:20px}
.prenum{font-family:var(--display);font-weight:700;font-size:170px;line-height:1;text-shadow:8px 8px 0 var(--coral)}
.presub{font-size:18px;font-weight:800;max-width:340px}

.tbar{height:14px;border:var(--b) solid var(--ink);border-radius:var(--r);background:var(--paper);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:left center;transition:background .3s}
.tbar.low i{background:var(--coral)}
.qrow{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.tpill{background:var(--ink);color:var(--paper);padding:2px 12px;border-radius:var(--r);min-width:62px;text-align:center;font-size:22px}
.tpill.low{background:var(--coral);color:var(--ink);animation:pulse .5s ease-in-out infinite}
.pstem{font-size:18px;font-weight:700;line-height:1.42;padding:14px 16px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink);font-weight:700;font-size:16.5px;line-height:1.3;transition:transform .08s,box-shadow .08s;min-height:62px}
.opt:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.opt .ol{flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--ink);color:var(--paper);border-radius:4px;font-family:var(--display);font-size:24px;line-height:1}
.opt .ol i{font-style:normal;font-size:11px;display:block;margin-bottom:-2px;opacity:.8}
.opt[disabled]{opacity:.5}
.ghost{border:var(--b) dashed var(--ink2);border-radius:var(--r);display:grid;place-items:center;font-weight:800;color:var(--ink2);font-size:14px;background:rgba(255,255,255,.4)}
.dodgelayer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;pointer-events:none}
.dodgelayer .opt{position:fixed;pointer-events:auto;margin:0;will-change:transform,left,top}
.taunt{position:fixed;z-index:70;max-width:min(78vw,330px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:var(--r);font-weight:800;font-size:16px;line-height:1.3;box-shadow:4px 4px 0 var(--coral);pointer-events:none;text-align:center}
.taunt::after{content:'';position:absolute;left:var(--tx,50%);width:14px;height:14px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
.taunt.above::after{bottom:-7px}.taunt.below::after{top:-7px}
.taunt.inline{position:relative;align-self:center;max-width:none;transform:rotate(-1.5deg)}
.taunt.inline::after{display:none}
.timesup{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:grid;place-items:center;background:rgba(255,251,239,.78)}

.plock{gap:16px}
.lockcard{padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh) var(--sh) 0 var(--ink)}
.lockcard .ol{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:4px}
.lockcard .ot{font-size:19px;font-weight:800;line-height:1.3}
.lockmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lockmsg{font-size:17px;font-weight:700;color:var(--ink2);text-align:center;line-height:1.4;padding:6px 10px}
.waitdots span{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:var(--ink);animation:pulse .9s ease-in-out infinite}
.waitdots span:nth-child(2){animation-delay:.15s}.waitdots span:nth-child(3){animation-delay:.3s}

.prev{align-items:stretch;text-align:center;gap:14px}
.verdict{font-family:var(--display);font-weight:700;font-size:62px;line-height:1;text-transform:uppercase;padding:14px 10px 10px;border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh) var(--sh) 0 var(--ink)}
.prev.ok .verdict{background:var(--teal)}.prev.no .verdict{background:var(--coral)}.prev.none .verdict{background:var(--yellow)}
.pts{font-family:var(--display);font-weight:700;font-size:46px;line-height:1}
.roast{font-size:17px;font-weight:700;color:var(--ink2);line-height:1.4}
.ansbox{padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.lbl{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.ansrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:var(--b) solid var(--ink);border-radius:var(--r);font-weight:800;line-height:1.3}
.ansrow .ol{flex:none;font-family:var(--display);font-size:18px;background:var(--ink);color:var(--paper);padding:4px 9px;border-radius:4px}
.rankmove{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center;font-weight:800}
.chipx{display:inline-block;padding:5px 12px;border:2px solid var(--ink);border-radius:var(--r);background:var(--paper);font-weight:800}
.pearl{padding:12px 14px;text-align:left;font-size:15px;line-height:1.45;font-weight:600;background:#FFF6C9}
.pearl b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}

.plb h2,.pfin h2{align-self:center;font-size:24px}
.lbrows{display:flex;flex-direction:column;gap:10px}
.lbrow{display:grid;grid-template-columns:44px 34px 1fr auto;align-items:center;gap:8px;padding:10px 12px;background:var(--paper);border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);font-weight:800}
.lbrow .rk{font-family:var(--display);font-size:22px}
.lbrow .av{font-size:24px}
.lbrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbrow .sc{font-family:var(--display);font-size:20px}
.lbrow .fire{font-size:13px;margin-left:4px}
.lbrow.me{background:var(--yellow)}
.lbrow:nth-child(1) .rk{color:#C2253A}
.lbsep{text-align:center;font-weight:900;letter-spacing:.3em;color:var(--ink2)}
.gap{text-align:center;font-weight:700;color:var(--ink2);line-height:1.4}

.pfin{text-align:center;align-items:center;gap:14px}
.susp{font-family:var(--display);font-weight:700;font-size:40px;text-transform:uppercase;line-height:1.05;margin-top:22vh}
.wwcd{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.95;font-size:40px;padding:14px 16px;background:var(--yellow);border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh) var(--sh) 0 var(--ink);transform:rotate(-2deg)}
.wwcd small{display:block;font-size:22px;margin-top:6px}
.winnm{font-size:26px;font-weight:900;overflow-wrap:anywhere}
.myrank{font-family:var(--display);font-weight:700;font-size:96px;line-height:.9;text-shadow:6px 6px 0 var(--teal)}
.minipod{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%}
.minipod div{flex:1;max-width:120px;border:var(--b) solid var(--ink);border-radius:var(--r) var(--r) 0 0;padding:8px 4px;font-weight:800;font-size:13px;overflow:hidden}
.minipod .av{font-size:26px;display:block}
.minipod .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clapbtn{width:min(64vw,250px);height:min(64vw,250px);border-radius:50%;border:var(--b) solid var(--ink);background:var(--coral);box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:20px;line-height:1.1;padding:18px;transition:transform .06s}
.clapbtn .em{font-size:76px;line-height:1}
.clapbtn:active{transform:scale(.94) rotate(-4deg)}
.clapstat{font-weight:800;color:var(--ink2)}

/* ================= HOST ================= */
html.hostmode{font-size:clamp(11px,calc(.82vw + .32vh),26px)}
.hshell{position:relative;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.hhead{display:flex;align-items:center;gap:1.2rem;padding:1.1rem 1.8rem .6rem}
.hlogo{font-family:var(--display);font-weight:700;font-size:1.7rem;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:.6rem}
.hlogo .tag{background:var(--ink);color:var(--yellow);padding:.15em .55em;border-radius:var(--r);font-size:.75em;letter-spacing:.12em}
.qdots{display:flex;gap:.5rem;margin:0 auto}
.qdots i{width:2.6rem;height:.75rem;border:2px solid var(--ink);border-radius:999px;background:var(--paper);transition:background .3s,width .3s}
.qdots i.done{background:var(--ink)}.qdots i.cur{background:var(--yellow);width:4rem}
.hpills{display:flex;gap:.7rem;align-items:center;margin-left:auto}
.hpill{display:inline-flex;align-items:center;gap:.45em;padding:.35em .8em;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:800;font-size:1rem;white-space:nowrap}
.iconbtn{width:2.6rem;height:2.6rem;border:2px solid var(--ink);border-radius:50%;background:var(--paper);box-shadow:2px 2px 0 var(--ink);font-size:1.15rem;display:grid;place-items:center}
.hstage{position:relative;padding:.6rem 1.8rem;min-height:0}
.hstage>*{height:100%}
.hfoot{display:flex;align-items:center;gap:1rem;padding:.6rem 1.8rem 1.4rem}
.hfoot .hint{font-weight:700;color:var(--ink2);font-size:1rem}
.hfoot .grow{flex:1}
.hfoot .btn{font-size:1.6rem}
.hmenu{position:absolute;right:1.8rem;top:4.2rem;z-index:50;padding:.6rem;display:flex;flex-direction:column;gap:.3rem;min-width:16rem}
.hmenu button{text-align:left;padding:.6rem .8rem;border-radius:var(--r);font-weight:700;font-size:1.05rem}
.hmenu button:hover{background:var(--yellow)}
.banner{position:absolute;left:50%;top:.2rem;transform:translateX(-50%);z-index:45;background:var(--coral);border:var(--b) solid var(--ink);border-radius:var(--r);padding:.5rem 1rem;font-weight:800;box-shadow:4px 4px 0 var(--ink)}
.hshell:not([data-ph=lobby]):not([data-ph=fin]) .shape{display:none}
.shape{position:absolute;z-index:0;border:var(--b) solid var(--ink);opacity:.42;animation:drift 22s ease-in-out infinite;pointer-events:none}
.hhead,.hstage,.hfoot{position:relative;z-index:1}

.hlock{display:grid;place-items:center;height:100%}
.hlock form{padding:2rem;display:flex;flex-direction:column;gap:1rem;width:min(30rem,92vw)}
.hlock input{padding:.8rem;border:var(--b) solid var(--ink);border-radius:var(--r);font-size:1.4rem;font-weight:700}

.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:2.2rem;height:100%;padding-bottom:.4rem}
.joinp{position:relative;padding:1.8rem 2rem;display:flex;flex-direction:column;justify-content:center;gap:1.1rem;transform:rotate(-1deg);min-height:0}
.joinp .sticker{align-self:flex-start;font-size:1.3rem}
.bigurl{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:1.02;overflow-wrap:anywhere}
.qrrow{display:flex;align-items:center;gap:1.4rem}
.qrbox{flex:none;width:min(38vh,19rem);aspect-ratio:1;background:#fff;border:var(--b) solid var(--ink);border-radius:var(--r);padding:.5rem;box-shadow:5px 5px 0 var(--ink)}
.qrbox svg{display:block;width:100%;height:100%}
.joinsteps{display:flex;flex-direction:column;gap:.7rem;font-weight:700;font-size:1.25rem;line-height:1.3}
.joinsteps b{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;margin-right:.5rem;background:var(--ink);color:var(--yellow);border-radius:50%;font-family:var(--display)}
.roster{display:flex;flex-direction:column;min-height:0;gap:1rem}
.rhead{display:flex;align-items:center;gap:1rem}
.rhead h2{font-family:var(--display);font-weight:700;font-size:2.6rem;text-transform:uppercase;line-height:1}
.rcount{font-size:1.8rem;background:var(--teal)}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:.75rem;align-content:flex-start;overflow:auto;padding:.3rem .6rem 1.2rem .2rem;min-height:0}
.chip{display:inline-flex;align-items:center;gap:.5rem;background:var(--paper);border:var(--b) solid var(--ink);border-radius:var(--r);padding:.45rem .9rem .45rem .55rem;font-weight:800;font-size:1.3rem;box-shadow:4px 4px 0 var(--ink);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;max-width:100%}
.chip .av{font-size:1.5em}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14em}
.chip.bot{border-style:dashed}
.chip:hover{background:#FFE1E1}
.chips.dense .chip{font-size:1rem;padding:.3rem .6rem .3rem .4rem;box-shadow:3px 3px 0 var(--ink)}
.empty{margin:auto;text-align:center;font-weight:800;font-size:1.6rem;color:var(--ink2);line-height:1.5}
.diag{font-size:.95rem;font-weight:700;color:var(--ink2)}

.hpre{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center}
.hpre .sticker{font-size:2rem}
.hbig{font-family:var(--display);font-weight:700;font-size:16rem;line-height:.9;text-shadow:12px 12px 0 var(--coral)}
.hpre .sub{font-size:2rem;font-weight:800}
.cd3{font-family:var(--display);font-weight:700;font-size:4rem;width:7rem;height:7rem;border:var(--b) solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--yellow);box-shadow:5px 5px 0 var(--ink)}

.hq{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:1.2rem;height:100%}
.qtop{display:flex;align-items:center;gap:1.6rem}
.qmeta{display:flex;flex-direction:column;gap:.7rem;flex:1;min-width:0}
.qmeta .sticker{align-self:flex-start;font-size:1.4rem}
.answered{font-weight:800;font-size:1.5rem}
.answered b{font-family:var(--display);font-size:2.2rem}
.avstack{display:flex;flex-wrap:wrap;gap:.25rem;min-height:2.2rem;max-height:4.6rem;overflow:hidden}
.avstack span{font-size:1.6rem;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.ring{position:relative;width:9rem;height:9rem;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .bgc{fill:var(--paper);stroke:var(--ink);stroke-width:5}
.ring .fgc{fill:none;stroke:var(--teal);stroke-width:11;transition:stroke .3s}
.ring.low .fgc{stroke:var(--coral)}
.ring .num{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:3rem}
.ring.low .num{animation:pulse .5s ease-in-out infinite}
.hstem{font-weight:800;font-size:2.35rem;line-height:1.28;max-width:76rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.2rem;min-height:0}
.tile{position:relative;display:flex;align-items:center;gap:1.1rem;padding:1rem 1.3rem;border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh) var(--sh) 0 var(--ink);font-weight:800;font-size:1.75rem;line-height:1.22;overflow:hidden;transition:opacity .4s,transform .4s,filter .4s}
.tile .tl{flex:none;width:3.8rem;height:3.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);border-radius:4px;font-family:var(--display);font-size:2.3rem;line-height:1}
.tile .tl i{font-style:normal;font-size:.8rem;opacity:.85}
.tile .tt{position:relative;z-index:1;flex:1}
.tile .bar{position:absolute;left:0;bottom:0;height:.7rem;width:100%;background:rgba(22,27,61,.85);transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.9,.3,1)}
.tile .cnt{position:relative;z-index:1;font-family:var(--display);font-size:2.6rem;min-width:3rem;text-align:right;opacity:0;transition:opacity .4s}
.tiles.rev .cnt{opacity:1}
.tiles.rev .tile.no{opacity:.38;filter:saturate(.4)}
.tiles.rev .tile.ok{transform:scale(1.025);box-shadow:10px 10px 0 var(--ink)}
.tile .tick{position:absolute;right:-.6rem;top:-.9rem;z-index:2;font-size:3.2rem;transform:rotate(12deg)}
.tiles.nervous .tile{animation:wig .5s ease-in-out infinite}
.tiles.nervous .tile:nth-child(2){animation-delay:.12s}.tiles.nervous .tile:nth-child(3){animation-delay:.25s}.tiles.nervous .tile:nth-child(4){animation-delay:.37s}
.qfoot{display:flex;gap:1.2rem;align-items:stretch;min-height:0}
.qfoot .card{padding:.8rem 1.1rem;font-weight:700;font-size:1.25rem;line-height:1.35}
.qfoot .pearl{flex:1;background:#FFF6C9}
.qfoot .stat{flex:none;display:flex;flex-direction:column;justify-content:center;text-align:center;min-width:11rem}
.qfoot .stat b{font-family:var(--display);font-size:2.3rem;line-height:1}
.dodgebar{font-weight:800;font-size:1.4rem;padding:.6rem 1rem;background:var(--paper);border:var(--b) dashed var(--ink);border-radius:var(--r);align-self:flex-start}
.dodgebar b{font-family:var(--display);font-size:2rem}

.hlb{display:flex;flex-direction:column;gap:1.2rem;max-width:80rem;margin:0 auto;width:100%}
.hlb h2{font-family:var(--display);font-weight:700;font-size:3.4rem;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:1rem}
.hlb h2 .sticker{font-size:1.2rem}
.hrows{position:relative;display:flex;flex-direction:column;gap:.9rem}
.hrow{position:relative;display:grid;grid-template-columns:4.5rem 3.2rem minmax(0,1fr) 9rem;align-items:center;gap:1rem;padding:.8rem 1.2rem;background:var(--paper);border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink);font-weight:800;font-size:1.8rem;overflow:hidden}
.hrow .fill{position:absolute;left:0;top:0;bottom:0;background:var(--yellow);z-index:0;transform-origin:left;transition:transform 1.1s cubic-bezier(.2,.9,.3,1)}
.hrow>*{position:relative;z-index:1}
.hrow .rk{font-family:var(--display);font-size:2.4rem}
.hrow .av{font-size:2.3rem}
.hrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .sc{font-family:var(--display);font-size:2.3rem;text-align:right}
.hrow .tags{display:inline-flex;gap:.4rem;margin-left:.7rem;font-size:1.1rem;vertical-align:middle}
.hrow .tags span{padding:.1rem .5rem;border:2px solid var(--ink);border-radius:var(--r);background:var(--paper)}
.climber{align-self:flex-start;font-size:1.3rem;background:var(--teal)}

.hfin{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:2rem;height:100%}
.finleft{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1rem;min-height:0}
.hwwcd{font-family:var(--display);font-weight:700;text-transform:uppercase;text-align:center;line-height:.92;font-size:4.6rem;padding:1rem 1.6rem;background:var(--yellow);border:var(--b) solid var(--ink);border-radius:var(--r);box-shadow:8px 8px 0 var(--ink);transform:rotate(-2deg)}
.hwwcd small{display:block;font-size:2.2rem;margin-top:.5rem}
.suspense{font-family:var(--display);font-weight:700;font-size:4.2rem;text-transform:uppercase;margin:auto 0}
.podium{display:flex;align-items:flex-end;gap:1.2rem;width:100%;max-width:56rem;flex:1;min-height:0}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;min-width:0;height:100%;justify-content:flex-end}
.pod .who{text-align:center;min-width:0;max-width:100%}
.pod .av{font-size:4rem;display:block}
.pod .nm{display:block;font-weight:900;font-size:1.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .sc{font-family:var(--display);font-size:1.7rem}
.pod .blk{width:100%;border:var(--b) solid var(--ink);border-bottom:0;border-radius:var(--r) var(--r) 0 0;display:flex;justify-content:center;padding-top:.6rem;font-family:var(--display);font-weight:700;font-size:4.2rem;transform-origin:bottom}
.pod.p1 .blk{height:62%;background:var(--yellow)}.pod.p2 .blk{height:44%;background:var(--teal)}.pod.p3 .blk{height:30%;background:var(--coral)}
.pod.p1 .av{font-size:5.4rem}
.crown{font-size:3.4rem;line-height:1;display:block}
.finright{display:flex;flex-direction:column;gap:1rem;min-height:0}
.clapcount{padding:1rem 1.2rem;display:flex;align-items:center;gap:1rem;font-weight:800;font-size:1.4rem}
.clapcount b{font-family:var(--display);font-size:3.2rem;line-height:1}
.finlist{flex:1;overflow:auto;padding:.8rem;display:flex;flex-direction:column;gap:.45rem;min-height:0}
.frow{display:grid;grid-template-columns:3rem 2.2rem minmax(0,1fr) auto;gap:.6rem;align-items:center;font-weight:800;font-size:1.25rem;padding:.3rem .5rem;border-bottom:2px dashed rgba(22,27,61,.2)}
.frow .rk{font-family:var(--display)}
.frow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .sc{font-family:var(--display)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.stats .card{padding:.6rem .8rem;font-weight:700;font-size:1.05rem;line-height:1.3;box-shadow:4px 4px 0 var(--ink)}
.stats .card b{display:block;font-family:var(--display);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}

@media (max-width:900px){
  html.hostmode{font-size:13px}
  .hshell{display:flex;flex-direction:column;height:auto;min-height:100vh;min-height:100dvh;overflow:visible}
  .hstage{flex:1}
  .shape{display:none}
  .lobby,.hfin{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .hstage>*{height:auto}
  .qdots{display:none}
}
@media (prefers-reduced-motion:reduce){
  .bob,.shape,.tiles.nervous .tile,.tpill.low,.ring.low .num{animation:none!important}
}

/* ---- no-big-screen additions ---- */
.qrow .na{font-family:var(--body);font-size:13px;font-weight:800;text-transform:none;letter-spacing:0;color:var(--ink2)}
.roomhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.roomhead .disp{font-weight:700;font-size:22px}
.roomhead .sticker{font-size:18px;padding:.15em .6em}
.roomchips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:5px 10px 5px 6px;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);box-shadow:3px 3px 0 var(--ink);font-weight:800;font-size:14px;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.rchip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.rchip.me{background:var(--yellow)}
.distbox{padding:14px;display:flex;flex-direction:column;gap:9px;text-align:left}
.drow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;font-weight:800}
.drow .dl{display:grid;place-items:center;height:30px;border:2px solid var(--ink);border-radius:4px;font-family:var(--display);font-size:17px}
.drow .dbar{height:16px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);overflow:hidden}
.drow .dbar i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.9,.3,1)}
.drow:not(.ok) .dbar i{opacity:.45}
.drow .dn{min-width:34px;text-align:right;font-family:var(--display);font-size:18px}
.fastest{font-weight:700;color:var(--ink2);margin-top:2px}
.finlistp{width:100%;padding:8px 10px;display:flex;flex-direction:column;gap:2px;text-align:left}
.finlistp .frow{font-size:15px;grid-template-columns:38px 28px minmax(0,1fr) auto}
.frow.me{background:var(--yellow);border-radius:4px}
.sharerow{display:flex;gap:.8rem;flex-wrap:wrap}
.sharerow .btn{font-size:1.05rem}
@media (max-width:900px){
  .hhead{flex-wrap:wrap;padding:12px 14px 6px;gap:8px}
  .hpills{gap:6px}.hpill{font-size:12px}.iconbtn{width:34px;height:34px}
  .hstage{padding:6px 14px}
  .hfoot{position:sticky;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,251,239,.95);border-top:var(--b) solid var(--ink)}
  .hfoot .btn{font-size:18px;flex:1}
  .hfoot .hint{display:none}
  .joinp{transform:none;padding:16px}
  .bigurl{font-size:28px}
  .qrrow{flex-direction:column;align-items:flex-start}
  .qrbox{width:min(70vw,260px)}
  .hstem{font-size:20px}
  .tile{font-size:17px;padding:10px 12px}
  .tile .tl{width:40px;height:40px;font-size:22px}
  .tile .cnt{font-size:26px}
  .ring{width:84px;height:84px}.ring .num{font-size:26px}
  .qfoot{flex-direction:column}
  .hrow{grid-template-columns:44px 30px minmax(0,1fr) 80px;font-size:17px;padding:8px 10px}
  .hrow .rk,.hrow .sc{font-size:20px}.hrow .av{font-size:22px}
  .hlb h2{font-size:30px;flex-wrap:wrap}
  .hwwcd{font-size:34px}.hwwcd small{font-size:18px}
  .podium{min-height:260px}
  .pod .av{font-size:36px}.pod.p1 .av{font-size:44px}.pod .nm{font-size:16px}.pod .sc{font-size:15px}.pod .blk{font-size:30px}
  .hpre .sticker{font-size:18px}.hbig{font-size:120px}.hpre .sub{font-size:18px}
  .suspense{font-size:30px}
  .rhead h2{font-size:28px}.rcount{font-size:20px}
  .chip{font-size:15px}
}

/* ---- admin messages ---- */
.pmsg{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--yellow);padding:8px 8px 8px 12px;font-weight:800;font-size:14.5px;line-height:1.3;border-bottom:var(--b) solid var(--ink);box-shadow:0 3px 0 var(--coral)}
.pmsg .mi{flex:none;font-size:17px}
.pmsg .mt{flex:1;min-width:0;overflow-wrap:anywhere}
.pmsg .mx,.msgpill .mx{flex:none;width:26px;height:26px;border-radius:50%;color:inherit;font-size:13px;font-weight:900;opacity:.8}
.msgpill{max-width:24rem;background:var(--ink);color:var(--yellow);border-color:var(--ink)}
.msgpill .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.msgbtn{font-size:1rem!important;padding:.35em .8em!important;box-shadow:3px 3px 0 var(--ink)!important}
.hmsg{position:absolute;right:1.8rem;top:4.4rem;z-index:55;width:min(38rem,calc(100vw - 2rem));padding:1.1rem;display:flex;flex-direction:column;gap:.8rem;animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
.msginp{width:100%;padding:.75rem .9rem;border:var(--b) solid var(--ink);border-radius:var(--r);font-size:1.25rem;font-weight:700;outline:none;background:#fff}
.msginp:focus{box-shadow:0 0 0 4px var(--yellow)}
.presets{display:flex;flex-wrap:wrap;gap:.5rem}
.presets .chipx{font-size:.95rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.presets .chipx:hover{background:var(--yellow)}
.hmsg .row{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:900px){.hmsg{position:fixed;left:10px;right:10px;top:70px;width:auto}.msginp{font-size:16px}.msgpill{max-width:100%}}

/* ---- leaderboard photo ---- */
.postercard{max-width:min(34em,94vw)!important;max-height:94vh}
.posterwrap{flex:1;min-height:0;overflow:auto;border:var(--b) solid var(--ink);border-radius:var(--r);background:#fff;box-shadow:4px 4px 0 var(--ink)}
.posterwrap img{display:block;width:100%;height:auto}
</style>
</head>
